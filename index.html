<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Report Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel=stylesheet href="./styles.css">
</head>

<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 md:p-8 max-w-7xl">

        <!-- Header -->
        <header class="mb-8 p-6 bg-white rounded-xl shadow-md">
            <div class="flex items-center space-x-4">
                <img src="https://placehold.co/64x64/00529B/FFFFFF?text=RCA" alt="RCA" class="h-16 w-16 rounded-full">
                <div>
                    <h1 class="text-3xl font-bold text-blue-900">Custom Report Generator</h1>
                    <!-- <p class="text-gray-600 mt-1">ew</p> -->
                </div>
            </div>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Configuration Panel -->
            <aside class="lg:col-span-1 bg-white p-6 rounded-xl shadow-md h-fit">
                <h2 class="text-xl font-semibold mb-4 border-b pb-2">Configuration</h2>
                <form id="generator-form" class="space-y-6">
                    <!-- Column Headers -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Header Columns</label>
                        <div id="headers-container">
                            <div class="header-input-group">
                                <input type="text" name="header" value="TransactionID"
                                    class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5"
                                    placeholder="e.g., TransactionID" required>
                                <!-- First element can't be removed -->
                            </div>
                            <div class="header-input-group">
                                <input type="text" name="header" value="ReferenceNo"
                                    class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5"
                                    placeholder="e.g., ReferenceNo" required>
                                <button type="button"
                                    class="remove-header-btn text-red-500 hover:text-red-700 p-1.5 rounded-full"><svg
                                        class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M15 12H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg></button>
                            </div>
                            <div class="header-input-group">
                                <input type="text" name="header" value="Amount"
                                    class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5"
                                    placeholder="e.g., Amount" required>
                                <button type="button"
                                    class="remove-header-btn text-red-500 hover:text-red-700 p-1.5 rounded-full"><svg
                                        class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M15 12H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg></button>
                            </div>
                        </div>
                        <button type="button" id="add-header-btn"
                            class="mt-2 text-sm text-blue-600 hover:text-blue-800 font-medium">+ Add Another
                            Header</button>
                    </div>

                    <!-- Record Count -->
                    <div>
                        <label for="record-count" class="block text-sm font-medium text-gray-700 mb-1">Number of
                            Records</label>
                        <input type="number" id="record-count" name="record-count" value="10" min="1" max="10000"
                            class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                    </div>

                    <!-- Delimiter -->
                    <div>
                        <label for="delimiter" class="block text-sm font-medium text-gray-700 mb-1">CSV
                            Delimiter</label>
                        <select id="delimiter" name="delimiter"
                            class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                            <option value="," selected>Comma (,)</option>
                            <option value=";">Semicolon (;)</option>
                            <option value="\t">Tab</option>
                            <option value="|">Pipe (|)</option>
                        </select>
                    </div>

                    <!-- File Name -->
                    <div>
                        <label for="file-name" class="block text-sm font-medium text-gray-700 mb-1">CSV File
                            Name</label>
                        <input type="text" id="file-name" name="file-name" value="report"
                            class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                    </div>

                    <button type="submit"
                        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-lg transition-colors duration-300 shadow-sm">
                        Generate Report
                    </button>
                </form>
            </aside>

            <!-- Data Preview Section -->
            <section class="lg:col-span-2 bg-white p-6 rounded-xl shadow-md">
                <div class="flex flex-wrap justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-xl font-semibold">Generated Data Preview</h2>
                    <div id="action-buttons" class="flex items-center space-x-2 hidden">
                        <button id="copy-btn"
                            class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-300 text-sm">
                            Copy CSV
                        </button>
                        <button id="download-btn"
                            class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-300 text-sm">
                            Download CSV
                        </button>
                    </div>
                </div>
                <div id="no-data" class="text-center py-16 text-gray-500">
                    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        aria-hidden="true">
                        <path vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="2"
                            d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V7a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    <h3 class="mt-2 text-sm font-medium">No data generated</h3>
                    <p class="mt-1 text-sm">Use the form to generate a new report.</p>
                </div>
                <div id="preview-container" class="overflow-x-auto hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50" id="preview-header">
                            <!-- Headers will be dynamically inserted here -->
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200" id="preview-body">
                            <!-- Rows will be dynamically inserted here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast">Copied to clipboard!</div>
    <script src="script.js"></script>
</body>

</html>
