<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel=stylesheet href="./styles.css">
</head>

<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 md:p-8 max-w-7xl">

        <!-- Header -->
        <header class="mb-8 p-6 bg-white rounded-xl shadow-md">
            <div class="flex items-center space-x-4">
                <img src="https://placehold.co/64x64/00529B/FFFFFF?text=RCA" alt="RCA" class="h-16 w-16 rounded-full">
                <div>
                    <h1 class="text-3xl font-bold text-blue-900">Report Generator</h1>
                    <!-- <p class="text-gray-600 mt-1">ew</p> -->
                </div>
            </div>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Configuration Panel -->
            <aside class="lg:col-span-1 bg-white p-6 rounded-xl shadow-md h-fit">
                <h2 class="text-xl font-semibold mb-4 border-b pb-2">Configuration</h2>

                <!-- Tab Navigation -->
                <div class="mb-6">
                    <div class="flex space-x-1 bg-gray-100 p-1 rounded-lg">
                        <button id="tab-single"
                            class="flex-1 py-2 px-4 text-sm font-medium rounded-md transition-colors duration-200 bg-white text-blue-700 shadow-sm">
                            Single Row
                        </button>
                        <button id="tab-bulk"
                            class="flex-1 py-2 px-4 text-sm font-medium rounded-md transition-colors duration-200 text-gray-500 hover:text-gray-700">
                            Bulk Generation
                        </button>
                    </div>
                </div>

                <!-- Tab 1: Single Row Generation -->
                <div id="tab-content-single" class="tab-content">
                    <form id="single-generator-form" class="space-y-6">
                        <!-- Report Type Selection -->
                        <div>
                            <label for="single-report-type" class="block text-sm font-medium text-gray-700 mb-2">Report
                                Type</label>
                            <select id="single-report-type" name="single-report-type"
                                class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                                <option value="">Select Report Type</option>
                                <option value="ReportPegadaianBayar">Report Pegadaian Bayar</option>
                                <option value="ReportPegadaianCicil">Report Pegadaian Cicil</option>
                                <option value="ReportBrimoASDP">Report Brimo ASDP</option>
                            </select>
                        </div>

                        <!-- JSON Inputs Container -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">JSON Data</label>
                            <div id="json-inputs-container" class="space-y-3">
                                <div class="json-input-group">
                                    <div class="flex items-center justify-between mb-2">
                                        <span class="text-sm text-gray-600">JSON #1</span>
                                        <button type="button"
                                            class="remove-json-btn text-red-500 hover:text-red-700 p-1 rounded-full hidden">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M6 18L18 6M6 6l12 12"></path>
                                            </svg>
                                        </button>
                                    </div>
                                    <textarea name="json-input" rows="4"
                                        class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 font-mono"
                                        placeholder="Paste your JSON data here..."></textarea>
                                </div>
                            </div>
                            <button type="button" id="add-json-btn"
                                class="mt-2 text-sm text-blue-600 hover:text-blue-800 font-medium">
                                + Add Another JSON
                            </button>
                        </div>

                        <!-- Delimiter -->
                        <div>
                            <label for="single-delimiter" class="block text-sm font-medium text-gray-700 mb-1">CSV
                                Delimiter</label>
                            <select id="single-delimiter" name="single-delimiter"
                                class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                                <option value="," selected>Comma (,)</option>
                                <option value=";">Semicolon (;)</option>
                                <option value="\t">Tab</option>
                                <option value="|">Pipe (|)</option>
                            </select>
                        </div>

                        <!-- File Name -->
                        <div>
                            <label for="single-file-name" class="block text-sm font-medium text-gray-700 mb-1">CSV File
                                Name</label>
                            <input type="text" id="single-file-name" name="single-file-name" value="report"
                                class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                        </div>

                        <button type="submit"
                            class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-lg transition-colors duration-300 shadow-sm">
                            Generate Report
                        </button>
                    </form>
                </div>

                <!-- Tab 2: Bulk Generation -->
                <div id="tab-content-bulk" class="tab-content hidden">
                    <form id="bulk-generator-form" class="space-y-6">
                        <!-- Report Type Selection -->
                        <div>
                            <label for="bulk-report-type" class="block text-sm font-medium text-gray-700 mb-2">Report
                                Type</label>
                            <select id="bulk-report-type" name="bulk-report-type"
                                class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                                <option value="">Select Report Type</option>
                                <option value="ReportPegadaianBayar">Report Pegadaian Bayar</option>
                                <option value="ReportPegadaianCicil">Report Pegadaian Cicil</option>
                                <option value="ReportBrimoASDP">Report Brimo ASDP</option>
                            </select>
                        </div>

                        <!-- JSON Input -->
                        <div>
                            <label for="bulk-json-input" class="block text-sm font-medium text-gray-700 mb-2">JSON
                                Data</label>
                            <textarea id="bulk-json-input" name="bulk-json-input" rows="8"
                                class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 font-mono"
                                placeholder="Paste your JSON data here...">{
  "feRequest": {
    "client_id": "CLIENT123",
    "jenisTransaksi": "BAYAR",
    "norek": "1234567890",
    "reffSwitching": "REF123456",
    "amount": "500000",
    "surcharge": "2500",
    "channelIdPegadaian": "CH001",
    "noIdentitas": "ID987654321",
    "reffBiller": "BILLER789",
    "clientId": "CLIENT456"
  },
  "feResponse": {
    "data": {
      "tglTransaksi": "20241201120000",
      "nominalUangMuka": "100000",
      "administrasi": "5000"
    },
    "responseCode": "00",
    "feeAmount": "1000"
  },
  "esb": {
    "creditAmount": "495000"
  }
}</textarea>
                            <p class="text-xs text-gray-500 mt-1">Enter the JSON data that will be used to generate the
                                report values</p>
                        </div>

                        <!-- Record Count -->
                        <div>
                            <label for="bulk-record-count" class="block text-sm font-medium text-gray-700 mb-1">Number
                                of Records</label>
                            <input type="number" id="bulk-record-count" name="bulk-record-count" value="10" min="1"
                                max="10000"
                                class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                        </div>

                        <!-- Delimiter -->
                        <div>
                            <label for="bulk-delimiter" class="block text-sm font-medium text-gray-700 mb-1">CSV
                                Delimiter</label>
                            <select id="bulk-delimiter" name="bulk-delimiter"
                                class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                                <option value="," selected>Comma (,)</option>
                                <option value=";">Semicolon (;)</option>
                                <option value="\t">Tab</option>
                                <option value="|">Pipe (|)</option>
                            </select>
                        </div>

                        <!-- File Name -->
                        <div>
                            <label for="bulk-file-name" class="block text-sm font-medium text-gray-700 mb-1">CSV File
                                Name</label>
                            <input type="text" id="bulk-file-name" name="bulk-file-name" value="report"
                                class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                        </div>

                        <button type="submit"
                            class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-lg transition-colors duration-300 shadow-sm">
                            Generate Report
                        </button>
                    </form>
                </div>
            </aside>

            <!-- Data Preview Section -->
            <section class="lg:col-span-2 bg-white p-6 rounded-xl shadow-md">
                <div class="flex flex-wrap justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-xl font-semibold">Generated Data Preview</h2>
                    <div id="action-buttons" class="flex items-center space-x-2 hidden">
                        <button id="copy-btn"
                            class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-300 text-sm">
                            Copy CSV
                        </button>
                        <button id="download-btn"
                            class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-300 text-sm">
                            Download CSV
                        </button>
                    </div>
                </div>
                <div id="no-data" class="text-center py-16 text-gray-500">
                    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        aria-hidden="true">
                        <path vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="2"
                            d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V7a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    <h3 class="mt-2 text-sm font-medium">No data generated</h3>
                    <p class="mt-1 text-sm">Complete the form to generate a new report.</p>
                </div>
                <div id="preview-container" class="overflow-x-auto hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50" id="preview-header">
                            <!-- Headers will be dynamically inserted here -->
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200" id="preview-body">
                            <!-- Rows will be dynamically inserted here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast">Copied to clipboard!</div>
    <script src="utils.js"></script>
    <script src="reports/pegadaian-bayar.js"></script>
    <script src="reports/pegadaian-cicil.js"></script>
    <script src="reports/brimo-asdp.js"></script>
    <script src="reports/index.js"></script>
    <script src="script.js"></script>
</body>

</html>
